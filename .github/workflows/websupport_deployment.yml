name: Build and deploy website

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-pull-request:
    name: Build pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

  build-and-deploy:
    name: Build and deploy master
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: production-ftp-deployment
      cancel-in-progress: false
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Create remote directories for static routes
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOYPSWD }}
          DEPLOY_USERNAME: ${{ vars.DEPLOYLOGIN }}
        run: |
          set -eu
          while IFS= read -r directory; do
            sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no -p 22 "$DEPLOY_USERNAME@getsharing.link" "mkdir -p '/$directory'"
          done < <(find dist -mindepth 1 -type d -printf '%P\n')

      - name: Deploy website over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: getsharing.link
          username: ${{ vars.DEPLOYLOGIN }}
          password: ${{ secrets.DEPLOYPSWD }}
          ssh_private_key: ""
          port: 22
          local_path: ./dist/*
          remote_path: /
          sftp_only: true
