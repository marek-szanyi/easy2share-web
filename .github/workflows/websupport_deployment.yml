name: Build and deploy website

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-pull-request:
    name: Build pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

  build-and-deploy:
    name: Build and deploy master
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: production-ftp-deployment
      cancel-in-progress: false
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Deploy website over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: getsharing.link
          username: ${{ vars.DEPLOYLOGIN }}
          password: ${{ secrets.DEPLOYPSWD }}
          protocol: ftps
          local-dir: ./dist/
